name: CI

on: push

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell
        run: |
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python -m pip install -r requirements.txt

      - name: Run tests
        shell: powershell
        run: .\.ci-venv\Scripts\python -m pytest --json-report --json-report-file=pytest-raw.json

      - name: Send report to receiver
        if: always()
        shell: powershell
        env:
          RECEIVER_URL: http://localhost:8000
        run: .\.ci-venv\Scripts\python send_report.py

        permissions:
          contents: read
          pages: write
          id-token: write

        jobs:
          test:
            # ... your existing test job, unchanged ...

          deploy:
            needs: test
            if: github.ref == 'refs/heads/main'
            runs-on: ubuntu-latest
            environment:
              name: github-pages
              url: ${{ steps.deployment.outputs.page_url }}
            steps:
              - uses: actions/checkout@v4
              - uses: actions/configure-pages@v5
              - uses: actions/upload-pages-artifact@v3
                with:
                  path: docs
              - id: deployment
                uses: actions/deploy-pages@v4

        